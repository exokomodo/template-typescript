# Shared proxy body, included by both the HTTP-only and TLS site configs.
#
# Installed by `make deploy/nginx` to /etc/nginx/snippets/@SERVICE_NAME@-proxy.conf.
# Belongs inside a `location` block.

proxy_pass http://@SERVICE_NAME@;

# Keepalive to the upstream requires HTTP/1.1 with no Connection header.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
