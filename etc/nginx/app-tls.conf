# Reverse proxy for the app, HTTPS.
#
# Installed by `make deploy/nginx` in place of app.conf once a certificate
# exists at @CERT_DIR@. Certbot never edits this file: it runs in `certonly
# --webroot` mode and only manages the certificate itself, so a deploy can
# safely overwrite the config without breaking TLS.

upstream @SERVICE_NAME@ {
    server @APP_HOST@:@APP_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name @SERVER_NAME@;

    # Renewals are answered over plain HTTP, so this must stay above the
    # redirect.
    location /.well-known/acme-challenge/ {
        root @ACME_WEBROOT@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The `http2 on;` directive only exists from nginx 1.25.1; this form is
    # merely deprecated there and works on the older nginx Debian ships.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name @SERVER_NAME@;

    access_log /var/log/nginx/@SERVICE_NAME@.access.log;
    error_log /var/log/nginx/@SERVICE_NAME@.error.log;

    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    # Spelled out rather than including certbot's options-ssl-nginx.conf, so
    # this config never depends on a file certbot may not have written yet.
    # No OCSP stapling: Let's Encrypt retired its OCSP responders, and stapling
    # without a `resolver` only produces warnings anyway.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        include snippets/@SERVICE_NAME@-proxy.conf;
    }
}
