# Reverse proxy for the app, plain HTTP.
#
# Installed by `make deploy/nginx` when no certificate exists yet for
# @SERVER_NAME@. Once `make deploy/tls` has issued one, deploys install
# app-tls.conf over this instead. The @PLACEHOLDER@ tokens are substituted at
# install time from the Makefile's deployment variables, so this file itself
# never needs editing when you rename the service or change the port.

upstream @SERVICE_NAME@ {
    server @APP_HOST@:@APP_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name @SERVER_NAME@;

    access_log /var/log/nginx/@SERVICE_NAME@.access.log;
    error_log /var/log/nginx/@SERVICE_NAME@.error.log;

    # Lets certbot answer the ACME challenge without stopping nginx.
    location /.well-known/acme-challenge/ {
        root @ACME_WEBROOT@;
    }

    location / {
        include snippets/@SERVICE_NAME@-proxy.conf;
    }
}
